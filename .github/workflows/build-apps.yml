name: Build Astra Nova Voice (APK / IPA / EXE)
# ตั้ง Repository variable ชื่อ VOICE_SERVER_URL (Settings > Secrets and variables > Actions > Variables)
# เป็นลิงก์ Render เช่น https://astranova-voice.onrender.com  แอปที่ได้จะให้ผู้เล่นกรอกแค่ชื่อ Xbox
on:
  workflow_dispatch:
  push:
    paths: ["app/**", "addon/**", ".github/workflows/**"]

env:
  VOICE_SERVER_URL: ${{ vars.VOICE_SERVER_URL }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: node scripts/set-server.js
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AstraNovaVoice.apk
      - uses: actions/upload-artifact@v4
        with: { name: AstraNovaVoice-Android-APK, path: app/AstraNovaVoice.apk }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: node scripts/set-server.js
      - run: |
          npx cap add ios
          node scripts/patch-native.js ios
          gem list xcodeproj -i || sudo gem install xcodeproj
          ruby scripts/add-ios-files.rb
          npx cap sync ios
      - name: Build unsigned IPA
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr AstraNovaVoice.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: AstraNovaVoice-iOS-IPA-unsigned, path: app/ios/App/AstraNovaVoice.ipa }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/set-server.js
      - run: npx electron-builder --win portable --x64
      - uses: actions/upload-artifact@v4
        with: { name: AstraNovaVoice-Windows-EXE, path: app/dist/*.exe }

  release:
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect files
        run: |
          mkdir -p out
          sh addon/build.sh "$PWD/out"
          cp artifacts/AstraNovaVoice-Android-APK/*.apk out/AstraNovaVoice-Android.apk
          cp artifacts/AstraNovaVoice-iOS-IPA-unsigned/*.ipa out/AstraNovaVoice-iOS.ipa
          cp artifacts/AstraNovaVoice-Windows-EXE/*.exe out/AstraNovaVoice-Windows.exe
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Astra Nova Voice (ล่าสุด)
          make_latest: true
          body: |
            ดาวน์โหลด Astra Nova Voice
            - AstraNovaVoice-Android.apk — แอป Android
            - AstraNovaVoice-iOS.ipa — แอป iPhone (ติดตั้งด้วย Sideloadly / AltStore)
            - AstraNovaVoice-Windows.exe — แอป Windows
            - AstraNovaVoice-World.mcaddon — แอดออนโลกธรรมดา
            - AstraNovaVoice-Server.mcaddon — แอดออนเซิฟเช่า (mcsv / BDS)
            เว็บสำหรับทุกเครื่อง: https://astranova-voice.onrender.com
          files: out/*
