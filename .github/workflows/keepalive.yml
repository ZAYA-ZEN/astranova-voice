name: Keep voice server awake

# Render free plan sleeps after ~15 min without traffic, and Minecraft's
# /wsserver gives up ("Connection closed") while it is waking. Ping it often.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz (retry while waking)
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 60 https://astranova-voice.onrender.com/healthz; then echo; exit 0; fi
            sleep 15
          done
          exit 1
