services:
  - type: web
    name: astranova-hub
    runtime: node
    branch: hub
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: node hub.js
    healthCheckPath: /healthz
    envVars:
      - key: LICENSE_SECRET      # ห้ามเปลี่ยน/ลบ ไม่งั้นคีย์ที่ขายไปใช้ไม่ได้ (จดเก็บไว้)
        generateValue: true
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD      # รหัสเข้า /admin — ตั้งเองในหน้า Environment ของ Render
        sync: false
      - key: PRICE
        value: "69"
      - key: MAX_SERVERS_PER_KEY
        value: "3"
