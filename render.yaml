services:
  - type: web
    name: astranova-voice
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: TOKEN_SECRET
        generateValue: true
      - key: MAX_RANGE
        value: "100"
